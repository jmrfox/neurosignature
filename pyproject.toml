[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurosignature"
version = "0.1.0"
description = "Functional system identification framework for dynamical neural operators"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
    "umap-learn>=0.5",
    "seaborn>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "jupyter>=1.0",
    "notebook>=7.0",
]
